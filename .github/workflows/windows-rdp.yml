name: Windows Cloud RDP

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      # DirectAdmin File Manager: /domains/pz25177.parspack.net/public_html/peyklink
      # Not /peyklink — that is a different folder at FTP home root.
      FTP_REMOTE_DIRECTORY: /domains/pz25177.parspack.net/public_html/peyklink
      FTP_REMOTE_FILE: peyklink-backup.zip
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

    steps:

      # ==========================================
      # 0. Prepare Telegram notifier (shared helper)
      # ASCII-only script: Windows PowerShell breaks on emoji/UTF-8 in GHA temp .ps1
      # ==========================================
      - name: 0. Prepare Telegram notifier
        shell: powershell
        run: |

          $lines = @(
            'function Get-TehranStamp {'
            '    $tz = [TimeZoneInfo]::FindSystemTimeZoneById("Iran Standard Time")'
            '    $tehran = [TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $tz)'
            '    return $tehran.ToString("yyyy-MM-dd HH:mm:ss")'
            '}'
            'function Get-GitHubRunInfo {'
            '    $runId = $Env:GITHUB_RUN_ID'
            '    $runUrl = "$($Env:GITHUB_SERVER_URL)/$($Env:GITHUB_REPOSITORY)/actions/runs/$runId"'
            '    return @{ RunId = $runId; RunUrl = $runUrl }'
            '}'
            'function Send-TelegramNotify {'
            '    param([Parameter(Mandatory = $true)][string]$Text)'
            '    $token = ("{0}" -f $Env:TELEGRAM_BOT_TOKEN).Trim()'
            '    $chatId = ("{0}" -f $Env:TELEGRAM_CHANNEL_ID).Trim()'
            '    $chatId = $chatId -replace "^[""]+|[""]+$", ""'
            '    if ([string]::IsNullOrWhiteSpace($token) -or [string]::IsNullOrWhiteSpace($chatId)) {'
            '        Write-Host "Telegram secrets not set; skip notify." -ForegroundColor Yellow'
            '        return'
            '    }'
            '    $uri = "https://api.telegram.org/bot$token/sendMessage"'
            '    function Invoke-TgSend([hashtable]$Payload) {'
            '        $json = $Payload | ConvertTo-Json -Compress'
            '        $tmp = Join-Path $env:TEMP ("tg-notify-" + [guid]::NewGuid().ToString("N") + ".json")'
            '        $utf8NoBom = New-Object System.Text.UTF8Encoding $false'
            '        [System.IO.File]::WriteAllText($tmp, $json, $utf8NoBom)'
            '        try {'
            '            $script:TgRaw = & curl.exe -sS -X POST $uri -H "Content-Type: application/json; charset=utf-8" --data-binary ("@" + $tmp)'
            '            if ($LASTEXITCODE -ne 0) { return $null }'
            '            return ($script:TgRaw | ConvertFrom-Json)'
            '        } finally {'
            '            Remove-Item -Force $tmp -ErrorAction SilentlyContinue'
            '        }'
            '    }'
            '    try {'
            '        $htmlPayload = @{ chat_id = $chatId; text = $Text; parse_mode = "HTML"; disable_web_page_preview = $true }'
            '        $resp = Invoke-TgSend $htmlPayload'
            '        if ($resp -and $resp.ok -eq $true) {'
            '            Write-Host "Telegram notification sent."'
            '            return'
            '        }'
            '        $desc = if ($resp) { $resp.description } else { "no response" }'
            '        Write-Host ("Telegram HTML send failed: " + $desc) -ForegroundColor Yellow'
            '        $plain = (($Text -replace "<[^>]+>", "") -replace "&lt;", "<") -replace "&gt;", ">"'
            '        $plain = ($plain -replace "&amp;", "&").Trim()'
            '        $plainPayload = @{ chat_id = $chatId; text = $plain; disable_web_page_preview = $true }'
            '        $resp2 = Invoke-TgSend $plainPayload'
            '        if ($resp2 -and $resp2.ok -eq $true) {'
            '            Write-Host "Telegram notification sent (plain text fallback)."'
            '            return'
            '        }'
            '        $desc2 = if ($resp2) { $resp2.description } else { $script:TgRaw }'
            '        Write-Host ("Telegram API error: " + $desc2) -ForegroundColor Yellow'
            '        Write-Host ("chat_id length=" + $chatId.Length + " (value not printed)") -ForegroundColor Yellow'
            '    } catch {'
            '        Write-Host ("Telegram notification failed: " + $_.Exception.Message) -ForegroundColor Yellow'
            '        if ($script:TgRaw) { Write-Host ("Telegram raw: " + $script:TgRaw) -ForegroundColor Yellow }'
            '    }'
            '}'
            'function Escape-TelegramHtml {'
            '    param([string]$Value)'
            '    if ($null -eq $Value) { return "" }'
            '    $v = ("{0}" -f $Value).Trim()'
            '    return ((($v -replace "&", "&amp;") -replace "<", "&lt;") -replace ">", "&gt;")'
            '}'
            'function Format-RunLink {'
            '    $run = Get-GitHubRunInfo'
            '    $url = Escape-TelegramHtml $run.RunUrl'
            '    $id = Escape-TelegramHtml $run.RunId'
            '    return ("Run: <a href=""{0}"">#{1}</a>" -f $url, $id)'
            '}'
            'function Notify-ServerReady {'
            '    param([string]$TailscaleIp)'
            '    $stamp = Get-TehranStamp'
            '    $msg = @('
            '        "<b>PeykLink Server</b>",'
            '        "Status: <b>SERVER STARTED (RDP Ready)</b>",'
            '        "",'
            '        ("Time: <code>{0}</code> (Tehran)" -f $stamp),'
            '        ("Tailscale IP: <code>{0}</code>" -f (Escape-TelegramHtml (("{0}" -f $TailscaleIp) -replace "\r?\n", ", "))),'
            '        "User: <code>CynetAdmin</code>",'
            '        "Hostname: <code>github-rdp-server</code>",'
            '        (Format-RunLink),'
            '        "",'
            '        "Preparing MongoDB and application..."'
            '    ) -join "`n"'
            '    Send-TelegramNotify $msg'
            '}'
            'function Notify-AppStarted {'
            '    param([int]$ProcessId)'
            '    $stamp = Get-TehranStamp'
            '    $msg = @('
            '        "<b>PeykLink Server</b>",'
            '        "Status: <b>APPLICATION STARTED</b>",'
            '        "",'
            '        ("Time: <code>{0}</code> (Tehran)" -f $stamp),'
            '        "Process: <code>PeykLink.Api</code>",'
            '        ("PID: <code>{0}</code>" -f $ProcessId),'
            '        "MongoDB: <code>127.0.0.1:27017</code>",'
            '        (Format-RunLink)'
            '    ) -join "`n"'
            '    Send-TelegramNotify $msg'
            '}'
            'function Notify-ServerRunning {'
            '    param([int]$AliveMinutes)'
            '    $stamp = Get-TehranStamp'
            '    $msg = @('
            '        "<b>PeykLink Server</b>",'
            '        "Status: <b>SERVER IS RUNNING</b>",'
            '        "",'
            '        ("Start time: <code>{0}</code> (Tehran)" -f $stamp),'
            '        ("Keep-alive: <code>{0}</code> minutes" -f $AliveMinutes),'
            '        "RDP: <code>CynetAdmin</code>",'
            '        "MongoDB: <code>127.0.0.1:27017</code>",'
            '        "App: <code>PeykLink.Api</code>",'
            '        (Format-RunLink),'
            '        "",'
            '        "After this period, backup starts and server shuts down."'
            '    ) -join "`n"'
            '    Send-TelegramNotify $msg'
            '}'
            'function Notify-ServerShuttingDown {'
            '    param([int]$AliveMinutes)'
            '    $stamp = Get-TehranStamp'
            '    $msg = @('
            '        "<b>PeykLink Server</b>",'
            '        "Status: <b>SERVER SHUTTING DOWN</b>",'
            '        "",'
            '        ("Time: <code>{0}</code> (Tehran)" -f $stamp),'
            '        ("Keep-alive finished (<code>{0}</code> minutes)" -f $AliveMinutes),'
            '        "Next: MongoDB backup + FTP upload",'
            '        (Format-RunLink)'
            '    ) -join "`n"'
            '    Send-TelegramNotify $msg'
            '}'
            'function Notify-BackupStarted {'
            '    $stamp = Get-TehranStamp'
            '    $msg = @('
            '        "<b>PeykLink Backup</b>",'
            '        "Status: <b>BACKUP IN PROGRESS</b>",'
            '        "",'
            '        ("Start time: <code>{0}</code> (Tehran)" -f $stamp),'
            '        "Runner: GitHub Actions (Windows)",'
            '        "Target file: <code>peyklink-backup.zip</code>",'
            '        (Format-RunLink),'
            '        "",'
            '        "Please wait until backup finishes..."'
            '    ) -join "`n"'
            '    Send-TelegramNotify $msg'
            '}'
            'function Notify-BackupSucceeded {'
            '    param('
            '        [string]$DurationText,'
            '        [string]$SizeText,'
            '        [long]$ZipBytes,'
            '        [int]$BsonCount,'
            '        [string]$FtpHost,'
            '        [string]$RemotePath'
            '    )'
            '    $stamp = Get-TehranStamp'
            '    $msg = @('
            '        "<b>PeykLink Backup</b>",'
            '        "Status: <b>BACKUP READY AND UPLOADED</b>",'
            '        "",'
            '        ("Finished: <code>{0}</code> (Tehran)" -f $stamp),'
            '        ("Duration: <code>{0}</code>" -f $DurationText),'
            '        ("Size: <code>{0}</code> ({1} bytes)" -f $SizeText, $ZipBytes),'
            '        ("BSON files: <code>{0}</code>" -f $BsonCount),'
            '        ("FTP Host: <code>{0}</code>" -f $FtpHost),'
            '        ("Path: <code>{0}</code>" -f $RemotePath),'
            '        (Format-RunLink)'
            '    ) -join "`n"'
            '    Send-TelegramNotify $msg'
            '}'
            'function Notify-BackupFailed {'
            '    param([string]$ErrorMessage)'
            '    $stamp = Get-TehranStamp'
            '    $safe = Escape-TelegramHtml $ErrorMessage'
            '    $msg = @('
            '        "<b>PeykLink Backup</b>",'
            '        "Status: <b>BACKUP FAILED</b>",'
            '        "",'
            '        ("Error time: <code>{0}</code> (Tehran)" -f $stamp),'
            '        ("Error: <code>{0}</code>" -f $safe),'
            '        (Format-RunLink)'
            '    ) -join "`n"'
            '    Send-TelegramNotify $msg'
            '}'
            'function Notify-JobFinished {'
            '    param([string]$JobStatus)'
            '    $stamp = Get-TehranStamp'
            '    $status = ("{0}" -f $JobStatus).Trim().ToLowerInvariant()'
            '    switch ($status) {'
            '        "success" {'
            '            $state = "Status: <b>SUCCESS</b>"'
            '            $extra = "Server stopped and this run completed successfully."'
            '        }'
            '        "cancelled" {'
            '            $state = "Status: <b>CANCELLED / INTERRUPTED</b>"'
            '            $extra = "Job may have been cancelled manually or hit timeout."'
            '        }'
            '        default {'
            '            $state = "Status: <b>FAILED</b>"'
            '            $extra = "Check GitHub Actions logs for error details."'
            '        }'
            '    }'
            '    $msg = @('
            '        "<b>PeykLink Job</b>",'
            '        $state,'
            '        "",'
            '        ("Time: <code>{0}</code> (Tehran)" -f $stamp),'
            '        ("Job Status: <code>{0}</code>" -f $JobStatus),'
            '        (Format-RunLink),'
            '        "",'
            '        $extra'
            '    ) -join "`n"'
            '    Send-TelegramNotify $msg'
            '}'
          )

          $utf8Bom = New-Object System.Text.UTF8Encoding $true
          [System.IO.File]::WriteAllText(
            "C:\PeykLink-TelegramNotify.ps1",
            ($lines -join "`r`n"),
            $utf8Bom
          )

          Write-Host "Telegram notifier ready: C:\PeykLink-TelegramNotify.ps1"

      # ==========================================
      # 1. Enable Remote Desktop & Firewall
      # ==========================================
      - name: 1. Enable Remote Desktop & Firewall
        shell: powershell
        run: |

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0

          Write-Host "Remote Desktop enabled."

      # ==========================================
      # 2. Create Admin Account
      # ==========================================
      - name: 2. Create Admin Account
        shell: powershell
        run: |

          Write-Host "Creating CynetAdmin..."

          $Password = ConvertTo-SecureString `
            "Cynet@2026" `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name "CynetAdmin" `
            -Password $Password `
            -PasswordNeverExpires `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "CynetAdmin" `
            -ErrorAction SilentlyContinue

          net user runneradmin Cynet@2026

          Write-Host "Admin account ready."

      # ==========================================
      # 3. Install & Connect Tailscale VPN
      # ==========================================
      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        shell: powershell
        run: |

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "C:\tailscale.msi"

          Write-Host "Installing Tailscale..."

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 10

          Write-Host "Connecting Tailscale..."

          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server"

          Start-Sleep -Seconds 10

          $ts_ip = & `
            "C:\Program Files\Tailscale\tailscale.exe" `
            ip -4

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "       >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "Username     : CynetAdmin" -ForegroundColor Yellow
          Write-Host "Password     : Cynet@2026" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "Connect using Remote Desktop:"
          Write-Host "mstsc -> $ts_ip"
          Write-Host "==================================================" -ForegroundColor Green

          if (Test-Path "C:\PeykLink-TelegramNotify.ps1") {
              . "C:\PeykLink-TelegramNotify.ps1"
              Notify-ServerReady -TailscaleIp "$ts_ip"
          }
      # ==========================================
      # 4. Install MongoDB
      # GitHub windows-latest ships docker.exe, but the engine pipe is
      # usually not running, so native MSI is the reliable path.
      # ==========================================
      - name: 4. Install MongoDB
        shell: powershell
        run: |

          $MongoVersion = "8.0.28"
          $MongoUrl = "https://fastdl.mongodb.org/windows/mongodb-windows-x86_64-$MongoVersion-signed.msi"
          $MongoMsi = "C:\mongodb.msi"

          Write-Host "Downloading MongoDB $MongoVersion..."

          Invoke-WebRequest -Uri $MongoUrl -OutFile $MongoMsi

          if (!(Test-Path $MongoMsi)) {
              throw "MongoDB MSI download failed."
          }

          Write-Host "Installing MongoDB..."

          Start-Process msiexec.exe -ArgumentList "/i `"$MongoMsi`" /qn /norestart" -Wait
          Start-Sleep -Seconds 10

          $MongoService = Get-Service -Name "MongoDB" -ErrorAction SilentlyContinue
          if ($null -eq $MongoService) {
              throw "MongoDB service was not found after MSI install."
          }

          Write-Host "MongoDB service found."

      # ==========================================
      # 5. Start MongoDB
      # App / mongorestore / mongodump use 127.0.0.1:27017
      # ==========================================
      - name: 5. Start MongoDB
        shell: powershell
        run: |

          $MongoData = "C:\MongoDB\data\db"

          if (Test-Path "C:\MongoDB") {
              Write-Host "Removing old MongoDB directory..."
              Remove-Item "C:\MongoDB" -Recurse -Force
          }

          New-Item -ItemType Directory -Path $MongoData -Force | Out-Null

          Write-Host "Searching for mongod.exe..."

          $MongoExe = $null
          $MongoSearchPaths = @(
              "C:\Program Files\MongoDB",
              "C:\Program Files (x86)\MongoDB"
          )

          foreach ($SearchPath in $MongoSearchPaths) {
              if (Test-Path $SearchPath) {
                  $FoundMongo = Get-ChildItem `
                    -Path $SearchPath `
                    -Recurse `
                    -Filter "mongod.exe" `
                    -File `
                    -ErrorAction SilentlyContinue |
                    Select-Object -First 1

                  if ($null -ne $FoundMongo) {
                      $MongoExe = $FoundMongo.FullName
                      break
                  }
              }
          }

          if ($null -eq $MongoExe) {
              throw "mongod.exe was not found on this Windows runner."
          }

          Write-Host "MongoDB executable: $MongoExe"
          Write-Host "Data directory    : $MongoData"

          Get-Service -Name "MongoDB" -ErrorAction SilentlyContinue |
            Stop-Service -Force -ErrorAction SilentlyContinue

          Write-Host "Starting mongod..."

          $MongoProcess = Start-Process `
            -FilePath $MongoExe `
            -ArgumentList "--dbpath `"$MongoData`" --bind_ip 127.0.0.1 --port 27017" `
            -WindowStyle Hidden `
            -PassThru

          Write-Host "MongoDB PID: $($MongoProcess.Id)"

          Add-Content -Path $Env:GITHUB_ENV -Value "MONGO_EXE=$MongoExe"
          Add-Content -Path $Env:GITHUB_ENV -Value "MONGO_DATA=$MongoData"

          Write-Host "Waiting for MongoDB on port 27017..."

          $MongoReady = $false
          for ($i = 1; $i -le 30; $i++) {
              Start-Sleep -Seconds 1

              if ($MongoProcess.HasExited) {
                  throw "MongoDB process stopped unexpectedly. Exit code: $($MongoProcess.ExitCode)"
              }

              try {
                  $tcp = New-Object System.Net.Sockets.TcpClient
                  $iar = $tcp.BeginConnect("127.0.0.1", 27017, $null, $null)
                  $ok = $iar.AsyncWaitHandle.WaitOne(1000, $false)
                  if ($ok) {
                      $tcp.EndConnect($iar)
                      $MongoReady = $true
                  }
                  $tcp.Close()
              }
              catch { }

              if ($MongoReady) {
                  Write-Host "MongoDB is listening on port 27017." -ForegroundColor Green
                  break
              }

              Write-Host "Waiting for MongoDB... [$i/30]"
          }

          if (!$MongoReady) {
              throw "MongoDB did not start on port 27017."
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "       >>> MONGODB IS RUNNING <<<" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Address : mongodb://127.0.0.1:27017"
          Write-Host "PID     : $($MongoProcess.Id)"
          Write-Host "Data    : $MongoData"
          Write-Host "Mongo   : $MongoExe"
          Write-Host "==================================================" -ForegroundColor Green

          $mongoHelper = @(
            'function Test-PeykLinkMongoPort {'
            '    param([int]$TimeoutMs = 2000)'
            '    $client = $null'
            '    try {'
            '        $client = New-Object System.Net.Sockets.TcpClient'
            '        $iar = $client.BeginConnect("127.0.0.1", 27017, $null, $null)'
            '        $ok = $iar.AsyncWaitHandle.WaitOne($TimeoutMs, $false)'
            '        if ($ok) { $client.EndConnect($iar); return $true }'
            '    } catch { }'
            '    finally { if ($client) { $client.Close() } }'
            '    return $false'
            '}'
            'function Ensure-PeykLinkMongoRunning {'
            '    param([switch]$ThrowOnFailure)'
            '    if (Test-PeykLinkMongoPort) {'
            '        Write-Host "MongoDB is listening on 127.0.0.1:27017."'
            '        return $true'
            '    }'
            '    Write-Host "MongoDB port 27017 is down. Restarting mongod..." -ForegroundColor Yellow'
            '    $exe = $Env:MONGO_EXE'
            '    $data = $Env:MONGO_DATA'
            '    if ([string]::IsNullOrWhiteSpace($data)) { $data = "C:\MongoDB\data\db" }'
            '    if ([string]::IsNullOrWhiteSpace($exe) -or !(Test-Path $exe)) {'
            '        $found = Get-ChildItem -Path @("C:\Program Files\MongoDB","C:\Program Files (x86)\MongoDB") -Recurse -Filter "mongod.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1'
            '        if ($found) { $exe = $found.FullName }'
            '    }'
            '    if ([string]::IsNullOrWhiteSpace($exe) -or !(Test-Path $exe)) {'
            '        if ($ThrowOnFailure) { throw "mongod.exe was not found. Cannot restart MongoDB." }'
            '        return $false'
            '    }'
            '    if (!(Test-Path $data)) { New-Item -ItemType Directory -Path $data -Force | Out-Null }'
            '    Get-Process -Name "mongod" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue'
            '    Start-Sleep -Seconds 2'
            '    Start-Process -FilePath $exe -ArgumentList "--dbpath `"$data`" --bind_ip 127.0.0.1 --port 27017" -WindowStyle Hidden | Out-Null'
            '    for ($n = 1; $n -le 30; $n++) {'
            '        Start-Sleep -Seconds 2'
            '        if (Test-PeykLinkMongoPort) {'
            '            Write-Host "MongoDB is listening on 127.0.0.1:27017."'
            '            return $true'
            '        }'
            '        Write-Host ("Waiting for MongoDB after restart... [{0}/30]" -f $n)'
            '    }'
            '    if ($ThrowOnFailure) { throw "MongoDB is not listening on 127.0.0.1:27017. Cannot create backup." }'
            '    return $false'
            '}'
          )

          $utf8Bom = New-Object System.Text.UTF8Encoding $true
          [System.IO.File]::WriteAllText(
            "C:\PeykLink-Mongo.ps1",
            ($mongoHelper -join "`r`n"),
            $utf8Bom
          )
          Write-Host "Mongo helper ready: C:\PeykLink-Mongo.ps1"

      # ==========================================
      # 6. Download MongoDB Backup from FTP
      # ==========================================
      - name: 6. Download MongoDB Backup from FTP
        shell: powershell
        run: |

          $BackupZip = "C:\peyklink-backup.zip"

          if ([string]::IsNullOrWhiteSpace($Env:FTP_HOST)) {
              $Env:FTP_HOST = "2193182619.cloudydl.com"
          }

          if ([string]::IsNullOrWhiteSpace($Env:FTP_PORT)) {
              $Env:FTP_PORT = "21"
          }

          if ([string]::IsNullOrWhiteSpace($Env:FTP_USERNAME)) {
              $Env:FTP_USERNAME = "pz25177"
          }

          if ([string]::IsNullOrWhiteSpace($Env:FTP_PASSWORD)) {
              $Env:FTP_PASSWORD = "akeCKW4M"
          }

          if ([string]::IsNullOrWhiteSpace($Env:FTP_REMOTE_DIRECTORY)) {
              $Env:FTP_REMOTE_DIRECTORY = "/domains/pz25177.parspack.net/public_html/peyklink"
          }

          if ([string]::IsNullOrWhiteSpace($Env:FTP_REMOTE_FILE)) {
              $Env:FTP_REMOTE_FILE = "peyklink-backup.zip"
          }

          $remoteDir = $Env:FTP_REMOTE_DIRECTORY.Trim().Replace('\', '/')

          if ([string]::IsNullOrWhiteSpace($remoteDir) -or $remoteDir -eq "/" -or $remoteDir -eq "/peyklink") {
              $remoteDir = "/domains/pz25177.parspack.net/public_html/peyklink"
          }
          else {
              if (-not $remoteDir.StartsWith("/")) {
                  $remoteDir = "/" + $remoteDir
              }

              $remoteDir = $remoteDir.TrimEnd("/")
          }

          $remoteFile = $Env:FTP_REMOTE_FILE.Trim()
          if ([string]::IsNullOrWhiteSpace($remoteFile)) {
              $remoteFile = "peyklink-backup.zip"
          }

          # Same File Manager folder the bot uploads to (domain public_html, not FTP-home /peyklink).
          # %2F (server-root) 550s on this host; home-relative URL matches the bot.
          $remotePath = "$remoteDir/$remoteFile"
          $ftpUri = "ftp://$($Env:FTP_HOST):$($Env:FTP_PORT)$remotePath"
          $ftpUriAbsolute = "ftp://$($Env:FTP_HOST):$($Env:FTP_PORT)/%2F$($remotePath.TrimStart('/'))"

          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "       >>> DOWNLOADING BACKUP FROM FTP <<<" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "FTP host : $($Env:FTP_HOST)"
          Write-Host "FTP path : $remotePath"
          Write-Host "FTP URI  : $ftpUri"
          Write-Host "Local    : $BackupZip"
          Write-Host "Must match bot upload path Backup.Ftp.RemoteDirectory/RemoteFileName"

          if (Test-Path $BackupZip) {
              Remove-Item $BackupZip -Force
          }

          $curlCfg = "C:\ftp-curl.conf"
          "user = `"$($Env:FTP_USERNAME):$($Env:FTP_PASSWORD)`"" |
            Set-Content -Path $curlCfg -Encoding ascii

          function Invoke-FtpCurl([string]$Uri, [string]$OutFile) {
              $prev = $ErrorActionPreference
              $ErrorActionPreference = 'Continue'
              & curl.exe `
                --config $curlCfg `
                --show-error `
                --fail `
                --connect-timeout 30 `
                --ftp-pasv `
                -o $OutFile `
                $Uri
              $code = $LASTEXITCODE
              $ErrorActionPreference = $prev
              return $code
          }

          $curlExit = 1

          try {
              Write-Host "Trying home-relative FTP path..."
              $curlExit = Invoke-FtpCurl $ftpUri $BackupZip

              if ($curlExit -ne 0) {
                  Write-Host "Home-relative download failed (curl $curlExit). Trying server-root path..." -ForegroundColor Yellow
                  if (Test-Path $BackupZip) {
                      Remove-Item $BackupZip -Force -ErrorAction SilentlyContinue
                  }
                  $curlExit = Invoke-FtpCurl $ftpUriAbsolute $BackupZip
              }
          }
          finally {
              Remove-Item $curlCfg -Force -ErrorAction SilentlyContinue
          }

          $hasBackup = $false

          if ($curlExit -eq 0 -and (Test-Path $BackupZip)) {
              $size = (Get-Item $BackupZip).Length

              Write-Host "Download completed."
              Write-Host "Size: $size bytes"

              if ($size -gt 0) {
                  $hasBackup = $true
              }
              else {
                  Write-Host "Downloaded file is empty. Ignoring it." -ForegroundColor Yellow
                  Remove-Item $BackupZip -Force -ErrorAction SilentlyContinue
              }
          }
          else {
              Write-Host ""
              Write-Host "No existing backup on FTP (first run or file missing)." -ForegroundColor Yellow
              Write-Host "Continuing with an empty MongoDB. A full backup will be uploaded at the end."

              if (Test-Path $BackupZip) {
                  Remove-Item $BackupZip -Force -ErrorAction SilentlyContinue
              }
          }

          if ($hasBackup) {
              Add-Content -Path $Env:GITHUB_ENV -Value "BACKUP_FOUND=true"
              Write-Host "BACKUP_FOUND=true"
          }

          # curl 78 must not fail the job: missing backup is a first-run case.
          exit 0

      # ==========================================
      # 7. Extract MongoDB Backup
      # ==========================================
      - name: 7. Extract MongoDB Backup
        if: env.BACKUP_FOUND == 'true'
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        shell: powershell
        run: |

          $BackupZip = "C:\peyklink-backup.zip"
          $ExtractPath = "C:\PeykLinkMongoBackup"

          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "       >>> EXTRACTING MONGODB BACKUP <<<" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Cyan

          # ==========================================
          # Check backup
          # ==========================================

          if (!(Test-Path $BackupZip)) {
              throw "Backup ZIP was not found: $BackupZip"
          }

          $BackupInfo = Get-Item $BackupZip

          Write-Host "Backup file : $($BackupInfo.FullName)"
          Write-Host "Backup size : $($BackupInfo.Length) bytes"

          if ($BackupInfo.Length -eq 0) {
              throw "Backup ZIP is empty."
          }

          # ==========================================
          # Prepare extraction directory
          # ==========================================

          Write-Host ""
          Write-Host "Preparing extraction directory..."

          if (Test-Path $ExtractPath) {

              Remove-Item `
                $ExtractPath `
                -Recurse `
                -Force `
                -ErrorAction SilentlyContinue
          }

          New-Item `
            -ItemType Directory `
            -Path $ExtractPath `
            -Force | Out-Null

          # ==========================================
          # Find 7-Zip
          # ==========================================

          Write-Host ""
          Write-Host "Searching for 7-Zip..."

          $SevenZipPaths = @(
              "C:\Program Files\7-Zip\7z.exe",
              "C:\Program Files (x86)\7-Zip\7z.exe"
          )

          $SevenZip = $null

          foreach ($Path in $SevenZipPaths) {

              if (Test-Path $Path) {

                  $SevenZip = $Path

                  Write-Host "7-Zip found:"
                  Write-Host $SevenZip

                  break
              }
          }

          # ==========================================
          # Install 7-Zip if necessary
          # ==========================================

          if ($null -eq $SevenZip) {

              Write-Host ""
              Write-Host "7-Zip not found. Installing 7-Zip..."

              winget install `
                --id 7zip.7zip `
                --exact `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements

              Start-Sleep -Seconds 5

              # Search again
              foreach ($Path in $SevenZipPaths) {

                  if (Test-Path $Path) {

                      $SevenZip = $Path

                      break
                  }
              }
          }

          # ==========================================
          # Final 7-Zip check
          # ==========================================

          if ($null -eq $SevenZip -or !(Test-Path $SevenZip)) {

              Write-Host ""
              Write-Host "ERROR: 7-Zip was not found." -ForegroundColor Red

              throw "7-Zip installation failed."
          }

          Write-Host ""
          Write-Host "7-Zip executable:"
          Write-Host $SevenZip

          # ==========================================
          # Check password
          # ==========================================

          if ([string]::IsNullOrWhiteSpace($Env:BACKUP_PASSWORD)) {

              Write-Host ""
              Write-Host "ERROR: BACKUP_PASSWORD is empty." -ForegroundColor Red

              throw "BACKUP_PASSWORD GitHub Secret is not configured."
          }

          Write-Host ""
          Write-Host "Backup password detected."
          Write-Host "Password itself will not be displayed."

          # ==========================================
          # Test ZIP archive first
          # ==========================================

          Write-Host ""
          Write-Host "Testing ZIP archive..."

          & $SevenZip t `
            $BackupZip `
            "-p$Env:BACKUP_PASSWORD"

          $TestExitCode = $LASTEXITCODE

          if ($TestExitCode -ne 0) {

              Write-Host ""
              Write-Host "==================================================" -ForegroundColor Red
              Write-Host "       >>> ZIP TEST FAILED <<<" -ForegroundColor Red
              Write-Host "==================================================" -ForegroundColor Red

              throw "7-Zip could not read/test the backup. Check ZIP integrity or BACKUP_PASSWORD."
          }

          Write-Host ""
          Write-Host "ZIP archive test passed." -ForegroundColor Green

          # ==========================================
          # Extract using 7-Zip
          # ==========================================

          Write-Host ""
          Write-Host "Extracting backup with 7-Zip..."

          & $SevenZip x `
            $BackupZip `
            "-o$ExtractPath" `
            "-p$Env:BACKUP_PASSWORD" `
            "-y"

          $ExtractExitCode = $LASTEXITCODE

          if ($ExtractExitCode -ne 0) {

              Write-Host ""
              Write-Host "==================================================" -ForegroundColor Red
              Write-Host "       >>> BACKUP EXTRACTION FAILED <<<" -ForegroundColor Red
              Write-Host "==================================================" -ForegroundColor Red
              Write-Host "7-Zip Exit Code: $ExtractExitCode"

              throw "Backup extraction failed."
          }

          # ==========================================
          # Verify extracted files
          # ==========================================

          Write-Host ""
          Write-Host "Checking extracted files..."

          $ExtractedFiles = Get-ChildItem `
            $ExtractPath `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue

          if ($null -eq $ExtractedFiles -or $ExtractedFiles.Count -eq 0) {

              Write-Host ""
              Write-Host "ERROR: No files were extracted." -ForegroundColor Red

              throw "Backup extraction produced no files."
          }

          Write-Host ""
          Write-Host "Extracted file count: $($ExtractedFiles.Count)"

          Write-Host ""
          Write-Host "Extracted files:"

          $ExtractedFiles |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          # ==========================================
          # Check BSON files
          # ==========================================

          $BsonFiles = Get-ChildItem `
            $ExtractPath `
            -Recurse `
            -Filter "*.bson" `
            -File `
            -ErrorAction SilentlyContinue

          if ($null -eq $BsonFiles -or $BsonFiles.Count -eq 0) {

              Write-Host ""
              Write-Host "WARNING: No BSON files were found." -ForegroundColor Yellow
              Write-Host "The archive may contain a different structure."
          }
          else {

              Write-Host ""
              Write-Host "BSON files found: $($BsonFiles.Count)"

              $BsonFiles |
                Select-Object FullName, Length |
                Format-Table -AutoSize
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "       >>> BACKUP EXTRACTED SUCCESSFULLY <<<" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Extract path: $ExtractPath"

          $CliSessionsZip = Get-ChildItem `
            $ExtractPath `
            -Recurse `
            -Filter "peyklink-cli-sessions.zip" `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $CliSessionsDest = "C:\PeykLinkCliSessions"
          if (Test-Path $CliSessionsDest) {
              Remove-Item $CliSessionsDest -Recurse -Force -ErrorAction SilentlyContinue
          }

          if ($null -ne $CliSessionsZip) {
              Write-Host "Restoring CLI session files from backup..."
              New-Item -ItemType Directory -Path $CliSessionsDest -Force | Out-Null
              & $SevenZip x `
                $CliSessionsZip.FullName `
                "-o$CliSessionsDest" `
                "-y"
              Write-Host "CLI sessions staged at $CliSessionsDest"
          }
          else {
              Write-Host "No peyklink-cli-sessions.zip in backup (older backup or first run)."
          }
      # ==========================================
      # 8. Restore MongoDB
      # ==========================================
      - name: 8. Restore MongoDB
        if: env.BACKUP_FOUND == 'true'
        shell: powershell
        run: |

          Write-Host "Searching for MongoDB dump..."

          $ExtractPath = "C:\PeykLinkMongoBackup"

          # Find first BSON file
          $BsonFile = Get-ChildItem `
            $ExtractPath `
            -Recurse `
            -Filter "*.bson" `
            -File `
            | Select-Object -First 1

          if ($null -eq $BsonFile) {
              throw "No BSON files were found in the backup."
          }

          Write-Host "Found BSON:"
          Write-Host $BsonFile.FullName

          # Standard mongodump structure:
          #
          # dump/
          #   database/
          #      collection.bson
          #
          # Therefore:
          # BSON parent      = database
          # database parent  = dump

          $DatabaseFolder = Split-Path `
            $BsonFile.FullName `
            -Parent

          $DumpFolder = Split-Path `
            $DatabaseFolder `
            -Parent

          Write-Host ""
          Write-Host "MongoDB dump directory:"
          Write-Host $DumpFolder

          # Find mongorestore
          $MongoRestore = $null

          $PossiblePaths = @(
              "C:\Program Files\MongoDB\Tools\100\bin\mongorestore.exe",
              "C:\Program Files\MongoDB\Tools\100.16\bin\mongorestore.exe",
              "C:\Program Files\MongoDB\Tools\100.16.1\bin\mongorestore.exe"
          )

          foreach ($Path in $PossiblePaths) {

              if (Test-Path $Path) {
                  $MongoRestore = $Path
                  break
              }
          }

          # If not installed, download MongoDB Database Tools
          if ($null -eq $MongoRestore) {

              Write-Host "MongoDB Database Tools not found."

              $ToolsZip = "C:\mongodb-tools.zip"

              Write-Host "Downloading MongoDB Database Tools..."

              Invoke-WebRequest `
                "https://fastdl.mongodb.org/tools/db/mongodb-database-tools-windows-x86_64-100.16.1.zip" `
                -OutFile $ToolsZip

              $ToolsExtract = "C:\MongoDBTools"

              if (Test-Path $ToolsExtract) {

                  Remove-Item `
                    $ToolsExtract `
                    -Recurse `
                    -Force
              }

              Expand-Archive `
                -Path $ToolsZip `
                -DestinationPath $ToolsExtract `
                -Force

              $MongoRestore = Get-ChildItem `
                $ToolsExtract `
                -Recurse `
                -Filter "mongorestore.exe" `
                -File `
                | Select-Object -First 1 `
                | Select-Object -ExpandProperty FullName
          }

          if ($null -eq $MongoRestore -or !(Test-Path $MongoRestore)) {
              throw "mongorestore.exe was not found."
          }

          Write-Host ""
          Write-Host "mongorestore:"
          Write-Host $MongoRestore

          Write-Host ""
          Write-Host "Restoring MongoDB..."

          & $MongoRestore `
            --host "127.0.0.1:27017" `
            --drop `
            "$DumpFolder"

          if ($LASTEXITCODE -ne 0) {
              throw "MongoDB restore failed."
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "       >>> MONGODB RESTORE COMPLETED <<<" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green

          Write-Host ""
          Write-Host "Removing local backup files after restore..."

          $BackupZip = "C:\peyklink-backup.zip"
          if (Test-Path $BackupZip) {
              Remove-Item $BackupZip -Force -ErrorAction SilentlyContinue
              Write-Host "Deleted backup zip: $BackupZip"
          }

          if (Test-Path $ExtractPath) {
              Remove-Item $ExtractPath -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Deleted extracted backup: $ExtractPath"
          }

      # ==========================================
      # 9. Clone PeykLinkbot Repository
      # ==========================================
      - name: 9. Clone PeykLinkbot Repository
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: powershell
        run: |

          Write-Host "Preparing repository directory..."

          if (Test-Path "D:\PeykLinkbot") {

              Remove-Item `
                "D:\PeykLinkbot" `
                -Recurse `
                -Force
          }

          Write-Host "Cloning repository..."

          git clone `
            "https://x-access-token:$Env:GH_TOKEN@github.com/javadnoruzi/PeykLinkbot.git" `
            "D:\PeykLinkbot"

          if ($LASTEXITCODE -ne 0) {
              throw "Git clone failed."
          }

          Write-Host "Repository cloned successfully."

          $CliSessionsDest = "C:\PeykLinkCliSessions"
          $RepoSessions = "D:\PeykLinkbot\telegram-cli-sessions"
          if (!(Test-Path $CliSessionsDest)) {
              New-Item -ItemType Directory -Path $CliSessionsDest -Force | Out-Null
          }

          $hostSessions = @(Get-ChildItem `
            $CliSessionsDest `
            -Recurse `
            -File `
            -Filter "*.session" `
            -ErrorAction SilentlyContinue)

          if ($hostSessions.Count -gt 0) {
              Write-Host "Using $($hostSessions.Count) CLI session file(s) from host $CliSessionsDest"
          }
          elseif (Test-Path $RepoSessions) {
              $seed = @(Get-ChildItem `
                $RepoSessions `
                -File `
                -Filter "*.session" `
                -ErrorAction SilentlyContinue)

              foreach ($file in $seed) {
                  Copy-Item $file.FullName -Destination (Join-Path $CliSessionsDest $file.Name) -Force
                  Write-Host "Seeded CLI session onto host: $($file.Name)"
              }

              if ($seed.Count -eq 0) {
                  Write-Host "No CLI session files in backup or repo; login will be required."
              }
          }
          else {
              Write-Host "No CLI session files on host or in repo; login will be required."
          }

      # ==========================================
      # 10. Restore .NET Dependencies
      # ==========================================
      - name: 10. Restore .NET Dependencies
        shell: powershell
        run: |

          cd D:\PeykLinkbot

          Write-Host "Running dotnet restore..."

          dotnet restore

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet restore failed."
          }

          Write-Host "Restore completed successfully."

      # ==========================================
      # 11. Build PeykLink.Api
      # ==========================================
      - name: 11. Build PeykLink.Api
        shell: powershell
        run: |

          cd D:\PeykLinkbot

          Write-Host "Building PeykLink.Api..."

          dotnet build `
            .\src\PeykLink.Api\PeykLink.Api.csproj `
            -c Debug `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet build failed."
          }

          Write-Host "Build completed successfully."

      # ==========================================
      # 12. Run PeykLink.Api
      # ==========================================
      - name: 12. Run PeykLink.Api
        shell: powershell
        run: |

          $AppPath = `
            "D:\PeykLinkbot\src\PeykLink.Api\bin\Debug\net8.0\PeykLink.Api.exe"

          if (!(Test-Path $AppPath)) {

              Write-Host "ERROR: Application not found!"
              Write-Host ""
              Write-Host "Expected path:"
              Write-Host $AppPath
              Write-Host ""

              Write-Host "Checking bin directory..."

              if (Test-Path "D:\PeykLinkbot\src\PeykLink.Api\bin") {

                  Get-ChildItem `
                    "D:\PeykLinkbot\src\PeykLink.Api\bin" `
                    -Recurse
              }

              throw "PeykLink.Api executable not found."
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "       >>> STARTING PEYKLINK API <<<" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Application: $AppPath"
          Write-Host ""

          $WorkDir = "D:\PeykLinkbot\src\PeykLink.Api"
          $BinDir = "D:\PeykLinkbot\src\PeykLink.Api\bin\Debug\net8.0"
          $OutLog = Join-Path $BinDir "peyklink-api-stdout.log"
          $ErrLog = Join-Path $BinDir "peyklink-api-stderr.log"
          $CrashLog = Join-Path $BinDir "peyklink-startup-error.log"

          foreach ($logFile in @($OutLog, $ErrLog, $CrashLog)) {
              if (Test-Path $logFile) {
                  Remove-Item $logFile -Force -ErrorAction SilentlyContinue
              }
          }

          $env:ASPNETCORE_URLS = "http://127.0.0.1:5044"
          $env:ASPNETCORE_ENVIRONMENT = "Production"
          $env:MongoDb__ConnectionString = "mongodb://127.0.0.1:27017"
          $env:TelegramCli__SessionsDirectory = "C:\PeykLinkCliSessions"
          New-Item -ItemType Directory -Path $env:TelegramCli__SessionsDirectory -Force | Out-Null
          Write-Host "CLI sessions directory: $($env:TelegramCli__SessionsDirectory)"

          $Process = Start-Process `
            -FilePath $AppPath `
            -WorkingDirectory $WorkDir `
            -PassThru `
            -RedirectStandardOutput $OutLog `
            -RedirectStandardError $ErrLog

          Start-Sleep -Seconds 30

          function Write-PeykLinkApiLogs {
              param([string]$Title)
              Write-Host ""
              Write-Host $Title -ForegroundColor Yellow
              foreach ($pair in @(
                  @{ Name = "stdout"; Path = $OutLog },
                  @{ Name = "stderr"; Path = $ErrLog },
                  @{ Name = "startup-error"; Path = $CrashLog }
              )) {
                  Write-Host ("----- {0} ({1}) -----" -f $pair.Name, $pair.Path)
                  if (Test-Path $pair.Path) {
                      Get-Content $pair.Path -ErrorAction SilentlyContinue
                  }
                  else {
                      Write-Host "(file not found)"
                  }
              }
          }

          if ($Process.HasExited) {
              Write-PeykLinkApiLogs "PeykLink.Api exited during startup. Dumping logs:"
              throw "PeykLink.Api stopped immediately. ExitCode: $($Process.ExitCode)"
          }

          Write-Host "PeykLink.Api started successfully."
          Write-Host "PID: $($Process.Id)"
          Write-PeykLinkApiLogs "Startup logs:"

          if (Test-Path "C:\PeykLink-TelegramNotify.ps1") {
              . "C:\PeykLink-TelegramNotify.ps1"
              Notify-AppStarted -ProcessId $Process.Id
          }
      # ==========================================
      # 13. Keep Server Alive
      # GitHub kills the job at 360 minutes.
      # Leave time after this loop for mongodump + zip + FTP upload.
      # ==========================================
      - name: 13. Keep Server Alive
        shell: powershell
        run: |

          $AliveMinutes = 280

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "       >>> SERVER IS RUNNING <<<" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green

          Write-Host ""
          Write-Host "RDP User     : CynetAdmin"
          Write-Host "MongoDB      : 127.0.0.1:27017"
          Write-Host "Application  : PeykLink.Api"
          Write-Host "Alive for    : $AliveMinutes minutes"
          Write-Host "Then         : full Mongo dump, zip, FTP upload"
          Write-Host ""

          if (Test-Path "C:\PeykLink-TelegramNotify.ps1") {
              . "C:\PeykLink-TelegramNotify.ps1"
              Notify-ServerRunning -AliveMinutes $AliveMinutes
          }

          for ($i = 1; $i -le $AliveMinutes; $i++) {

              Start-Sleep -Seconds 60

              Write-Host "[$i/$AliveMinutes] Server running..."

              if (($i % 10) -eq 0) {
                  Write-Host "Checking MongoDB health..."
                  try {
                      if (Test-Path "C:\PeykLink-Mongo.ps1") {
                          . "C:\PeykLink-Mongo.ps1"
                          Ensure-PeykLinkMongoRunning | Out-Null
                      }
                  }
                  catch {
                      Write-Host ("MongoDB health check failed: {0}" -f $_.Exception.Message) -ForegroundColor Yellow
                  }
              }

              # --- پوش خودکار سشن CLI (فعلاً غیرفعال؛ بعد از دسترسی توکن uncomment کن) ---
              # if (($i % 30) -eq 0) {
              #     Write-Host "Periodic CLI session push (new files only)..."
              #     try { Push-CliSessions -NewOnly $true }
              #     catch { Write-Host "Periodic session push skipped: $($_.Exception.Message)" }
              # }
          }

          Write-Host ""
          Write-Host "Keep-alive finished. Starting FTP backup..."

          if (Test-Path "C:\PeykLink-TelegramNotify.ps1") {
              . "C:\PeykLink-TelegramNotify.ps1"
              Notify-ServerShuttingDown -AliveMinutes $AliveMinutes
          }
      # ==========================================
      # 13b. Commit & push telegram-cli-sessions (فعلاً غیرفعال)
      # بعد از دادن دسترسی push به GH_TOKEN این استپ را uncomment کن.
      # همچنین function Push-CliSessions را در استپ 13 بالا فعال کن.
      # ==========================================
      # - name: 13b. Push CLI session files
      #   if: always()
