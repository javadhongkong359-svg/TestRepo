      # ==========================================
      # 14. Dump MongoDB, zip with password, upload to FTP
      # ==========================================
      - name: 14. Backup MongoDB and Upload to FTP
        if: always()
        shell: powershell
        run: |

          $BackupZip = "C:\peyklink-backup.zip"
          $DumpOut = "C:\PeykLinkMongoDump"
          $BackupStartedAtUtc = (Get-Date).ToUniversalTime()

          if (Test-Path "C:\PeykLink-TelegramNotify.ps1") {
              . "C:\PeykLink-TelegramNotify.ps1"
          }
          else {
              function Notify-BackupStarted { Write-Host "Notifier missing; skip Telegram." -ForegroundColor Yellow }
              function Notify-BackupSucceeded { Write-Host "Notifier missing; skip Telegram." -ForegroundColor Yellow }
              function Notify-BackupFailed { Write-Host "Notifier missing; skip Telegram." -ForegroundColor Yellow }
          }

          function Format-ByteSize([long]$Bytes) {
              if ($Bytes -ge 1GB) { return "{0:N2} GB" -f ($Bytes / 1GB) }
              if ($Bytes -ge 1MB) { return "{0:N2} MB" -f ($Bytes / 1MB) }
              if ($Bytes -ge 1KB) { return "{0:N2} KB" -f ($Bytes / 1KB) }
              return "$Bytes B"
          }

          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "       >>> FULL MONGODB BACKUP TO FTP <<<" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Cyan

          Notify-BackupStarted

          try {

          if ([string]::IsNullOrWhiteSpace($Env:FTP_HOST)) {
              $Env:FTP_HOST = "2193182619.cloudydl.com"
          }

          if ([string]::IsNullOrWhiteSpace($Env:FTP_PORT)) {
              $Env:FTP_PORT = "21"
          }

          if ([string]::IsNullOrWhiteSpace($Env:FTP_USERNAME)) {
              $Env:FTP_USERNAME = "pz25177"
          }

          if ([string]::IsNullOrWhiteSpace($Env:FTP_PASSWORD)) {
              $Env:FTP_PASSWORD = "akeCKW4M"
          }

          if ([string]::IsNullOrWhiteSpace($Env:FTP_REMOTE_DIRECTORY)) {
              $Env:FTP_REMOTE_DIRECTORY = "/domains/pz25177.parspack.net/public_html/peyklink"
          }

          if ([string]::IsNullOrWhiteSpace($Env:FTP_REMOTE_FILE)) {
              $Env:FTP_REMOTE_FILE = "peyklink-backup.zip"
          }

          if ([string]::IsNullOrWhiteSpace($Env:BACKUP_PASSWORD)) {
              throw "BACKUP_PASSWORD GitHub Secret is not configured."
          }

          if (Test-Path "C:\PeykLink-Mongo.ps1") {
              . "C:\PeykLink-Mongo.ps1"
              Ensure-PeykLinkMongoRunning -ThrowOnFailure | Out-Null
          }
          else {
              $mongoReady = $false
              try {
                  $tcp = New-Object System.Net.Sockets.TcpClient
                  $iar = $tcp.BeginConnect("127.0.0.1", 27017, $null, $null)
                  $mongoReady = $iar.AsyncWaitHandle.WaitOne(2000, $false)
                  if ($mongoReady) { $tcp.EndConnect($iar) }
                  $tcp.Close()
              }
              catch {
                  $mongoReady = $false
              }

              if (-not $mongoReady) {
                  throw "MongoDB is not listening on 127.0.0.1:27017. Cannot create backup."
              }
          }

          $mongoDump = $null
          $searchRoots = @(
              "C:\MongoDBTools",
              "C:\Program Files\MongoDB",
              "C:\Program Files (x86)\MongoDB"
          )

          foreach ($root in $searchRoots) {
              if (Test-Path $root) {
                  $found = Get-ChildItem `
                    -Path $root `
                    -Recurse `
                    -Filter "mongodump.exe" `
                    -File `
                    -ErrorAction SilentlyContinue |
                    Select-Object -First 1

                  if ($null -ne $found) {
                      $mongoDump = $found.FullName
                      break
                  }
              }
          }

          if ($null -eq $mongoDump) {
              Write-Host "Downloading MongoDB Database Tools..."

              $toolsZip = "C:\mongodb-tools-backup.zip"
              $toolsExtract = "C:\MongoDBTools"

              Invoke-WebRequest `
                "https://fastdl.mongodb.org/tools/db/mongodb-database-tools-windows-x86_64-100.16.1.zip" `
                -OutFile $toolsZip

              if (Test-Path $toolsExtract) {
                  Remove-Item $toolsExtract -Recurse -Force
              }

              Expand-Archive `
                -Path $toolsZip `
                -DestinationPath $toolsExtract `
                -Force

              $mongoDump = Get-ChildItem `
                $toolsExtract `
                -Recurse `
                -Filter "mongodump.exe" `
                -File |
                Select-Object -First 1 |
                Select-Object -ExpandProperty FullName
          }

          if ($null -eq $mongoDump -or !(Test-Path $mongoDump)) {
              throw "mongodump.exe was not found."
          }

          Write-Host "mongodump: $mongoDump"

          if (Test-Path $DumpOut) {
              Remove-Item $DumpOut -Recurse -Force
          }

          New-Item -ItemType Directory -Path $DumpOut -Force | Out-Null

          Write-Host "Running full mongodump..."

          & $mongoDump `
            --host "127.0.0.1:27017" `
            --out $DumpOut

          if ($LASTEXITCODE -ne 0) {
              throw "mongodump failed."
          }

          $bsonFiles = Get-ChildItem `
            $DumpOut `
            -Recurse `
            -Filter "*.bson" `
            -File `
            -ErrorAction SilentlyContinue

          if ($null -eq $bsonFiles -or $bsonFiles.Count -eq 0) {
              throw "mongodump produced no BSON files."
          }

          Write-Host "BSON files dumped: $($bsonFiles.Count)"

          $sevenZipPaths = @(
              "C:\Program Files\7-Zip\7z.exe",
              "C:\Program Files (x86)\7-Zip\7z.exe"
          )

          $sevenZip = $null

          foreach ($path in $sevenZipPaths) {
              if (Test-Path $path) {
                  $sevenZip = $path
                  break
              }
          }

          if ($null -eq $sevenZip) {
              Write-Host "Installing 7-Zip..."

              winget install `
                --id 7zip.7zip `
                --exact `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements

              Start-Sleep -Seconds 5

              foreach ($path in $sevenZipPaths) {
                  if (Test-Path $path) {
                      $sevenZip = $path
                      break
                  }
              }
          }

          if ($null -eq $sevenZip -or !(Test-Path $sevenZip)) {
              throw "7-Zip was not found."
          }

          if (Test-Path $BackupZip) {
              Remove-Item $BackupZip -Force
          }

          Write-Host "Stopping PeykLink.Api so CLI session files can be copied..."
          Get-Process -Name "PeykLink.Api" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          $CliSessionsDest = "C:\PeykLinkCliSessions"
          $CliSessionsZip = Join-Path $DumpOut "peyklink-cli-sessions.zip"
          if (Test-Path $CliSessionsDest) {
              $sessionFiles = @(Get-ChildItem `
                $CliSessionsDest `
                -Recurse `
                -File `
                -Filter "*.session" `
                -ErrorAction SilentlyContinue)
              if ($sessionFiles.Count -gt 0) {
                  Write-Host "Packing $($sessionFiles.Count) CLI session file(s) from host into backup..."
                  if (Test-Path $CliSessionsZip) {
                      Remove-Item $CliSessionsZip -Force
                  }
                  $sessionNames = $sessionFiles | ForEach-Object { $_.FullName }
                  Compress-Archive -Path $sessionNames -DestinationPath $CliSessionsZip -Force
              }
              else {
                  Write-Host "No CLI session files on host to pack."
              }
          }

          Write-Host "Creating password-protected ZIP..."

          & $sevenZip a `
            -tzip `
            -mx=9 `
            "-p$Env:BACKUP_PASSWORD" `
            -mem=AES256 `
            $BackupZip `
            "$DumpOut\*"

          if ($LASTEXITCODE -ne 0 -or !(Test-Path $BackupZip)) {
              throw "7-Zip failed to create the backup archive."
          }

          $zipSize = (Get-Item $BackupZip).Length

          if ($zipSize -eq 0) {
              throw "Backup ZIP is empty."
          }

          Write-Host "ZIP created. Size: $zipSize bytes"

          $remoteDir = $Env:FTP_REMOTE_DIRECTORY.Trim().Replace('\', '/')

          if ([string]::IsNullOrWhiteSpace($remoteDir) -or $remoteDir -eq "/" -or $remoteDir -eq "/peyklink") {
              $remoteDir = "/domains/pz25177.parspack.net/public_html/peyklink"
          }
          else {
              if (-not $remoteDir.StartsWith("/")) {
                  $remoteDir = "/" + $remoteDir
              }

              $remoteDir = $remoteDir.TrimEnd("/")
          }

          $remoteFile = $Env:FTP_REMOTE_FILE.Trim()
          if ([string]::IsNullOrWhiteSpace($remoteFile)) {
              $remoteFile = "peyklink-backup.zip"
          }

          # Same File Manager folder the bot uploads to (domain public_html, not FTP-home /peyklink).
          $remotePath = "$remoteDir/$remoteFile"
          $ftpUri = "ftp://$($Env:FTP_HOST):$($Env:FTP_PORT)$remotePath"
          $ftpUriAbsolute = "ftp://$($Env:FTP_HOST):$($Env:FTP_PORT)/%2F$($remotePath.TrimStart('/'))"

          Write-Host "Uploading to FTP path: $remotePath"
          Write-Host "Same path as bot Backup.Ftp.RemoteDirectory/RemoteFileName"
          Write-Host "Same filename will be overwritten for the next restore."

          $curlCfg = "C:\ftp-curl-upload.conf"
          "user = `"$($Env:FTP_USERNAME):$($Env:FTP_PASSWORD)`"" |
            Set-Content -Path $curlCfg -Encoding ascii

          function Invoke-FtpUpload([string]$Uri) {
              $prev = $ErrorActionPreference
              $ErrorActionPreference = 'Continue'
              & curl.exe `
                --config $curlCfg `
                --show-error `
                --fail `
                --connect-timeout 30 `
                --retry 3 `
                --retry-delay 5 `
                --ftp-pasv `
                --ftp-create-dirs `
                -T $BackupZip `
                $Uri
              $code = $LASTEXITCODE
              $ErrorActionPreference = $prev
              return $code
          }

          try {
              $uploadExit = Invoke-FtpUpload $ftpUri
              if ($uploadExit -ne 0) {
                  Write-Host "Home-relative upload failed (curl $uploadExit). Trying server-root path..." -ForegroundColor Yellow
                  $uploadExit = Invoke-FtpUpload $ftpUriAbsolute
              }

              if ($uploadExit -ne 0) {
                  throw "FTP upload failed."
              }
          }
          finally {
              Remove-Item $curlCfg -Force -ErrorAction SilentlyContinue
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "       >>> BACKUP UPLOADED TO FTP <<<" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Host : $($Env:FTP_HOST)"
          Write-Host "Path : $remotePath"
          Write-Host "Size : $zipSize bytes"
          Write-Host "==================================================" -ForegroundColor Green

          $duration = (Get-Date).ToUniversalTime() - $BackupStartedAtUtc
          $durationText = "{0:hh\:mm\:ss}" -f $duration
          $sizeText = Format-ByteSize $zipSize

          Notify-BackupSucceeded `
            -DurationText $durationText `
            -SizeText $sizeText `
            -ZipBytes $zipSize `
            -BsonCount $bsonFiles.Count `
            -FtpHost $Env:FTP_HOST `
            -RemotePath $remotePath

          Write-Host "Removing local backup files after FTP upload..."
          if (Test-Path $BackupZip) {
              Remove-Item $BackupZip -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path $DumpOut) {
              Remove-Item $DumpOut -Recurse -Force -ErrorAction SilentlyContinue
          }

          }
          catch {
              $errMsg = $_.Exception.Message
              if ([string]::IsNullOrWhiteSpace($errMsg)) { $errMsg = "$_" }

              Notify-BackupFailed -ErrorMessage $errMsg

              throw
          }

      # ==========================================
      # 15. Final job status notify (success / failure / cancelled)
      # ==========================================
      - name: 15. Notify final job status
        if: always()
        shell: powershell
        env:
          JOB_STATUS: ${{ job.status }}
        run: |

          if (!(Test-Path "C:\PeykLink-TelegramNotify.ps1")) {
              Write-Host "Notifier script missing; skip final notify."
              exit 0
          }

          . "C:\PeykLink-TelegramNotify.ps1"
          Notify-JobFinished -JobStatus "$Env:JOB_STATUS"
